name: Build and publish releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained application
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          dotnet publish KaraokeManager.csproj -c Release -r "${{ matrix.rid }}" --self-contained true \
            -p:Version="$version" -p:InformationalVersion="$version" -o "publish/${{ matrix.rid }}"
          printf '%s\n' "$version" > "publish/${{ matrix.rid }}/KaraokeManager.update"
          (cd "publish/${{ matrix.rid }}" && zip -q -r "../../KaraokeManager-${{ matrix.rid }}.zip" .)
          sha256sum "KaraokeManager-${{ matrix.rid }}.zip" > "KaraokeManager-${{ matrix.rid }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: |
            KaraokeManager-${{ matrix.rid }}.zip
            KaraokeManager-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
